server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**

            - id: portfolio-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/portfolios/**

            - id: transaction-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/transactions/**

            - id: security-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/securities/**
  data:
    redis:
      host: localhost
      port: 6379